  min_component_size: 3
  max_grasp_pos: 200

  graspnet:
    ckpt_path: '../ckpts/graspnet/checkpoint-rs.tar'
    num_point: 20000
    num_view: 300
    collision_threshold: 0.01
    voxel_size: 0.01