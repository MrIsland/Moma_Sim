
# Task name - used to pick the class to load
task_name: ${task.name}
# experiment name. defaults to name of training config
experiment: ''

# if set to positive integer, overrides the default number of environments
num_envs: 32 # 1024, 32, 64

# seed - set to -1 to choose random seed
seed: 42
# set to True for deterministic performance
torch_deterministic: False

# set the maximum number of learning iterations to train for. overrides default per-environment setting
max_iterations: ''

## Device config
#  'physx' or 'flex'
physics_engine: 'physx'
# whether to use cpu or gpu pipeline
pipeline: 'gpu'
# device for running physics simulation
sim_device: 'cuda:0'
# device to run RL
rl_device: 'cuda:0'
graphics_device_id: 0

## PhysX arguments
num_threads: 4 # Number of worker threads per scene used by PhysX - for CPU PhysX only.
solver_type: 1 # 0: pgs, 1: tgs
num_subscenes: 4 # Splits the simulation into N physics scenes and runs each one in a separate thread

# RLGames Arguments
# test - if set, run policy in inference mode (requires setting checkpoint to load)
test: False
# used to set checkpoint path
#checkpoint: './runs/dagger/dagger_with_model/MomaMovePickBottleWGraspPosDR_15-16-14-31/nn/model_600.pth'
checkpoint: './runs/dagger/dagger_with_model/MomaMovePickBottleWGraspPosDR_15-16-14-31/nn/model_600_optim.pth'
#checkpoint: './runs/dagger/MomaMovePickBottleWGraspPosDR_11-21-38-26/nn/model_24099.pt'
#checkpoint: './runs/MomaMovePickBottleWGraspPosDR_23-17-48-28/nn/MomaMovePickBottleWGraspPosDR.pth'
#checkpoint: './runs/MomaMovePickBottleWGraspPosDR_22-11-49-11/nn/MomaMovePickBottleWGraspPosDR.pth'
#checkpoint: './runs/MomaMovePickBottleWGraspPos_04-18-47-59/nn/MomaMovePickBottleWGraspPos.pth'
#checkpoint: './runs/success/MomaMovePickBottleStateWGraspPos_22-01-40-09/nn/last_MomaMovePickBottleStateWGraspPos_ep_49300_rew_44.855564.pth'
#checkpoint: './runs/success/Move_pick_v1/nn/last_MomaMovePick_ep_12500_rew_239.5632.pth'
#checkpoint: './runs/success/Move_pick_v1/nn/last_MomaMovePick_ep_12500_rew_239.5632.pth'
# set sigma when restoring network
sigma: ''
# set to True to use multi-gpu training
multi_gpu: False

wandb_activate: False
wandb_group: ''
wandb_name: ${train.params.config.name}
wandb_entity: ''
wandb_project: 'isaacgymenvs'
wandb_tags: []
wandb_logcode_dir: '' 

capture_video: False
capture_video_freq: 1464
capture_video_len: 100
force_render: True

# disables rendering
headless: False

# set default task and default training config based on task
defaults:
  - task: Ant
  - train: ${task}PPO
  - pbt: no_pbt
  - override hydra/job_logging: disabled
  - _self_

# set the directory where the output files get saved
hydra:
  output_subdir: null
  run:
    dir: .

