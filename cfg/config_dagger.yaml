# Task name - used to pick the class to load
task_name: ${student.task.name}
# experiment name. defaults to name of training config
experiment: ''

dataset:
  path: '/media/island/igrape_20T/island/moma/vision_trained_data/high_dr'

expert:
  name: ${expert.task.name}
  checkpoint: './runs/success/2_LPF.pth'

student:
  name: ${student.task.name}
  #   model_24090.pth / or not
#  checkpoint: ''
  checkpoint: './runs/dagger/dagger_with_dataset/MomaMovePickBottleWGraspPosDR_12-22-16-38/model.pth'
  seed: 42
  num_envs: 64
  # set to True for deterministic performance
  torch_deterministic: False
  task_name: ${task_name}


  ## Device config
  #  'physx' or 'flex'
  physics_engine: 'physx'
  # whether to use cpu or gpu pipeline
  pipeline: 'gpu'
  # device for running physics simulation
  sim_device: 'cuda:0'
  # device to run RL
  rl_device: 'cuda:0'

  graphics_device_id: 0
  # disables rendering
  headless: False

  multi_gpu: False

  capture_video: False
  capture_video_freq: 1464
  capture_video_len: 100
  force_render: True
  max_iterations: ''

  ## PhysX arguments
  num_threads: 4 # Number of worker threads per scene used by PhysX - for CPU PhysX only.
  solver_type: 1 # 0: pgs, 1: tgs
  num_subscenes: 4 # Splits the simulation into N physics scenes and runs each one in a separate thread


  wandb_name: ${student.task.name}

learn:
  algo: dagger_with_model
  test: False
  save_interval: 100
  print_log: True

  # rollout params
  max_iterations: 100

  pipeline: 'gpu'

  # training params
  cliprange: 0.2
  ent_coef: 0
  buffer_size: 2000
  nsteps: 1
  noptepochs: 10   # learning iterations
  nminibatches: 32 # this is per agent / collect minibatch for learning each iteration.
  max_grad_norm: 1
  lr: 3.e-4 # 3e-4 is default for single agent training with constant schedule
  schedule: adaptive # could be adaptive or linear or fixed
  desired_kl: 0.016
  gamma: 0.96
  lam: 0.95
  init_noise_std: 0.8

# set default task and default training config based on task
defaults:
  #  vision / student
  - task@student.task: MomaMovePickBottleWGraspPosDR
  - train@student.train: MomaMovePickBottleWGraspPosDRPPO
  #  state / expert
  - task@expert.task: MomaMovePickBottleStateWGraspPosDR
  - train@expert.train: MomaMovePickBottleStateWGraspPosDRPPO
  - pbt: no_pbt
  - override hydra/job_logging: disabled
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .


